; marshal configuration — copy to marshal.ini and adjust for your machine
; marshal.ini is per-environment and should not be committed

[core]
window_size = 4096
temp_dir    = .\cache
max_streams = 256

[upload]
; posts reconciled results to the FIA scrutineering ingest service
; svc_marshal is provisioned for ingest only (no interactive logon)
endpoint     = https://scrutineering.fia-technical.io/ingest
username     = svc_marshal
password     = CHANGE_ME
timeout_secs = 30
verify_tls   = true

[logging]
level = info
file  = .\logs\marshal.log
